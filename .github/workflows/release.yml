name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host build and behavior tests
        run: |
          make clean
          make test

  package:
    runs-on: ubuntu-latest
    needs: test
    container:
      # The image sets USER buildbot (uid 1000); the runner's mounted work
      # directories belong to another uid, so actions/checkout cannot write
      # its state file. Run the container as root.
      image: ghcr.io/openwrt/sdk:aarch64_cortex-a53-23.05.4
      options: --user root
    env:
      STAGING_DIR: /builder/staging_dir
      CROSS_CC: /builder/staging_dir/toolchain-aarch64_cortex-a53_gcc-12.3.0_musl/bin/aarch64-openwrt-linux-musl-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Set package version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Cross-compile for aarch64 musl
        run: |
          make clean
          make CC="$CROSS_CC"
          file quec_battery

      - name: Build .ipk
        run: |
          VERSION='${{ steps.version.outputs.version }}' \
            ARCH=aarch64_cortex-a53 \
            ./packaging/build-ipk.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quec-battery2-${{ steps.version.outputs.version }}
          path: |
            quec_battery
            dist/*.ipk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: quec-battery2 v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            quec_battery
            dist/*.ipk
